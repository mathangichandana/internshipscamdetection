{% extends "layout.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <div class="card-header" style="text-align: center;">
            <h2>🔐 Account Login</h2>
            <p>Sign in to save and access your personal scam check history.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
